<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ShopKart — Fashion, Electronics & Grocery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --green:#0f6b4a;
  --green-dark:#0a4f37;
  --green-light:#e7f5ee;
  --gold:#d4af37;
  --ink:#12151a;
  --sub:#6b7280;
  --line:#ececef;
  --bg:#f7f8f6;
  --card:#ffffff;
  --radius:5px;
  --header-h:56px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{
  font-family:'Inter',sans-serif;
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  padding-bottom:64px;
}
body.lock{overflow:hidden;}
a{color:inherit;text-decoration:none;}
img{display:block;max-width:100%;}
button{font-family:inherit;cursor:pointer;border:none;background:none;}

/* ===== Header ===== */
header{
  position:fixed;top:0;left:0;right:0;z-index:200;
  background:linear-gradient(135deg,#0a4f37,#0f6b4a 55%,#14805a);
  box-shadow:0 4px 18px rgba(10,40,28,.28);
}
#pageTop{padding-top:var(--header-total-h,100px);}
.header-top{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px 8px;
}
.logo{
  display:flex;align-items:center;gap:8px;color:#fff;font-weight:800;font-size:18px;flex-shrink:0;
}
.logo-mark{
  width:34px;height:34px;border-radius:9px;
  background:linear-gradient(160deg,#fff,#e8f6ee);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 6px rgba(0,0,0,.18), inset 0 0 0 1px rgba(212,175,55,.4);
}
.logo-mark svg{width:20px;height:20px;}
.logo b{letter-spacing:-.02em;}
.logo b span{color:var(--gold);}
.logo-sub{display:none;}
.loc-strip{
  display:flex;align-items:center;gap:6px;padding:0 12px 8px;color:rgba(255,255,255,.92);
  font-size:11px;font-weight:600;
}
.loc-strip svg{flex-shrink:0;color:var(--gold);}
.loc-strip b{color:#fff;font-weight:700;}
.loc-strip .loc-status{
  margin-left:auto;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;
  display:flex;align-items:center;gap:4px;
}
.loc-strip .loc-status.ok{background:rgba(255,255,255,.16);color:#c9f5db;}
.loc-strip .loc-status.no{background:rgba(255,90,90,.2);color:#ffb4b4;}
.loc-strip .loc-status.pending{background:rgba(255,255,255,.12);color:rgba(255,255,255,.8);}
.loc-dot{width:6px;height:6px;border-radius:50%;background:currentColor;}
.search-bar{
  flex:1;display:flex;align-items:center;gap:8px;
  background:#fff;border-radius:5px;padding:10px 12px;
  transition:transform .15s ease;
}
.search-bar:active{transform:scale(.98);}
.search-bar svg{flex-shrink:0;color:var(--sub);}
.search-bar input{
  flex:1;border:none;outline:none;background:transparent;font-size:14px;color:var(--ink);
}
.header-icon{
  position:relative;width:36px;height:36px;border-radius:5px;
  display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;
  transition:transform .2s cubic-bezier(.34,1.56,.64,1),background .2s;
}
.header-icon:active{transform:scale(.9);background:rgba(255,255,255,.15);}
.header-icon .badge{
  position:absolute;top:-3px;right:-3px;background:#ff5252;color:#fff;
  font-size:9.5px;font-weight:700;min-width:16px;height:16px;padding:0 3px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  transition:transform .35s cubic-bezier(.34,1.56,.64,1);
}
.header-icon .badge.pop{animation:badgePop .4s cubic-bezier(.34,1.56,.64,1);}
@keyframes badgePop{0%{transform:scale(1)}40%{transform:scale(1.5)}100%{transform:scale(1)}}

/* Category nav — icon only, smooth switch */
.catnav{
  display:flex;gap:8px;overflow-x:auto;padding:2px 10px 10px;
  scrollbar-width:none;
}
.catnav::-webkit-scrollbar{display:none;}
.catnav button{
  flex-shrink:0;width:44px;height:44px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  color:rgba(255,255,255,.85);background:rgba(255,255,255,.12);
  transition:transform .3s cubic-bezier(.34,1.56,.64,1),background .25s ease,color .25s ease,box-shadow .25s ease;
  position:relative;
}
.catnav button svg{width:20px;height:20px;transition:transform .3s cubic-bezier(.34,1.56,.64,1);}
.catnav button:active{transform:scale(.85);}
.catnav button.active{
  background:#fff;color:var(--green-dark);transform:scale(1.05);
  box-shadow:0 4px 12px rgba(0,0,0,.18), 0 0 0 2px rgba(212,175,55,.55);
}
.catnav button.active svg{transform:scale(1.08);}

/* ===== Hero banner card ===== */
.hero-wrap{padding:12px;}
.hero-card{
  border-radius:var(--radius);overflow:hidden;position:relative;
  background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.06);
}
.hero-card img{width:100%;height:auto;display:block;}
.hero-dots{
  position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:5px;
}
.hero-dots span{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.55);transition:all .3s;}
.hero-dots span.active{background:#fff;width:16px;border-radius:3px;}

/* ===== Section ===== */
.section{padding:16px 12px 4px;}
.section-head{
  display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;
}
.section-head h2{font-size:16px;font-weight:800;letter-spacing:-.01em;}
.section-head a{font-size:12px;font-weight:700;color:var(--green-dark);display:flex;align-items:center;gap:2px;}

/* ===== Product grid ===== */
.grid{
  display:grid;grid-template-columns:repeat(2,1fr);gap:10px;
}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr);}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr);}}
@media(min-width:1200px){.grid{grid-template-columns:repeat(5,1fr);}}

.card{
  background:var(--card);border-radius:var(--radius);overflow:hidden;
  border:1px solid var(--line);
  display:flex;flex-direction:column;
  transition:transform .25s cubic-bezier(.34,1.56,.64,1),box-shadow .25s ease,border-color .25s;
  opacity:0;transform:translateY(14px);animation:cardIn .5s ease forwards;
}
@keyframes cardIn{to{opacity:1;transform:translateY(0);}}
.card:active{transform:scale(.97);}
@media(hover:hover){
  .card:hover{transform:translateY(-4px);box-shadow:0 14px 28px rgba(10,40,28,.12);border-color:rgba(15,107,74,.25);}
}
.card-img-wrap{
  position:relative;width:100%;aspect-ratio:1/1;background:#f8f9fa;overflow:hidden;
}
.card-img-wrap img{
  width:100%;height:100%;object-fit:cover;transition:transform .5s ease;
}
.card:hover .card-img-wrap img{transform:scale(1.06);}
.wish-btn{
  position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;
  background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;
  color:#9aa0a6;transition:transform .2s cubic-bezier(.34,1.56,.64,1),color .2s;
  box-shadow:0 1px 3px rgba(0,0,0,.12);
}
.wish-btn:active{transform:scale(.85);}
.wish-btn.active{color:#ff5252;}
.wish-btn.active svg{fill:#ff5252;}
.discount-tag{
  position:absolute;top:6px;left:6px;background:linear-gradient(120deg,var(--green),var(--green-dark));color:#fff;
  font-size:9.5px;font-weight:800;padding:2px 6px;border-radius:4px;
  box-shadow:0 1px 3px rgba(0,0,0,.2);
}
.card-body{padding:8px 9px 9px;display:flex;flex-direction:column;gap:3px;flex:1;}
.card-brand{font-size:10px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.03em;}
.card-title{
  font-size:12.5px;font-weight:600;line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  min-height:32px;color:var(--ink);
}
.card-rating{display:flex;align-items:center;gap:4px;font-size:10.5px;color:var(--sub);margin-top:1px;}
.card-rating .stars{background:var(--green);color:#fff;font-weight:700;padding:1px 5px;border-radius:3px;font-size:10px;display:flex;align-items:center;gap:2px;}
.card-price-row{display:flex;align-items:baseline;gap:6px;margin-top:2px;}
.price-now{font-size:14.5px;font-weight:800;color:var(--ink);}
.price-old{font-size:11px;color:var(--sub);text-decoration:line-through;}
.price-off{font-size:11px;color:var(--green-dark);font-weight:700;}

.card-cta{padding:0 9px 9px;margin-top:auto;}
.add-btn{
  width:100%;padding:8px 0;border-radius:var(--radius);
  background:var(--green);color:#fff;font-size:12px;font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:6px;
  transition:transform .18s cubic-bezier(.34,1.56,.64,1),background .2s;
}
.add-btn:active{transform:scale(.94);}
.add-btn:hover{background:var(--green-dark);}

.qty-stepper{
  width:100%;display:flex;align-items:center;justify-content:space-between;
  background:var(--green);border-radius:var(--radius);overflow:hidden;
  animation:stepperIn .3s cubic-bezier(.34,1.56,.64,1);
}
@keyframes stepperIn{from{transform:scale(.85);opacity:.4;}to{transform:scale(1);opacity:1;}}
.qty-stepper button{
  width:30px;height:30px;color:#fff;font-size:16px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
  transition:background .15s;
}
.qty-stepper button:active{background:rgba(0,0,0,.15);}
.qty-stepper span{color:#fff;font-size:12.5px;font-weight:800;}
.qty-stepper span.bump{animation:bump .3s cubic-bezier(.34,1.56,.64,1);}
@keyframes bump{0%{transform:scale(1)}50%{transform:scale(1.3)}100%{transform:scale(1)}}

/* ===== Category title strip ===== */
.cat-band{
  margin:0 -12px;padding:14px 12px;background:linear-gradient(135deg,var(--green-light),#fff);
}

/* ===== Bottom mobile nav ===== */
.mobile-nav{
  position:fixed;bottom:0;left:0;right:0;z-index:250;
  background:#fff;border-top:1px solid var(--line);
  display:flex;justify-content:space-around;padding:6px 0 8px;
  box-shadow:0 -2px 10px rgba(0,0,0,.06);
}
.mobile-nav a{
  display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--sub);
  font-size:10px;font-weight:600;padding:4px 10px;position:relative;
  transition:color .2s,transform .2s;
}
.mobile-nav a.active{color:var(--green);}
.mobile-nav a:active{transform:scale(.9);}
.mobile-nav .badge{
  position:absolute;top:-2px;right:2px;background:#ff5252;color:#fff;font-size:9px;font-weight:700;
  min-width:14px;height:14px;border-radius:50%;display:flex;align-items:center;justify-content:center;
}

/* ===== Cart / Wishlist panel ===== */
.overlay{
  position:fixed;inset:0;z-index:400;background:rgba(10,10,9,.5);
  opacity:0;pointer-events:none;transition:opacity .35s ease;
}
.overlay.open{opacity:1;pointer-events:auto;}
.panel{
  position:fixed;top:0;right:0;bottom:0;width:100%;max-width:400px;background:#fff;
  display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .4s cubic-bezier(.19,1,.22,1);
}
.overlay.open .panel{transform:translateX(0);}
.panel-head{
  display:flex;align-items:center;justify-content:space-between;padding:16px;border-bottom:1px solid var(--line);
}
.panel-head h3{font-size:16px;font-weight:800;}
.panel-close{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--bg);transition:transform .2s;}
.panel-close:active{transform:rotate(90deg);}
.panel-body{flex:1;overflow-y:auto;padding:8px 12px;}
.panel-item{
  display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);
  animation:rowIn .35s ease both;
}
@keyframes rowIn{from{opacity:0;transform:translateX(14px);}to{opacity:1;transform:translateX(0);}}
.panel-item.removing{animation:rowOut .3s ease forwards;}
@keyframes rowOut{to{opacity:0;transform:translateX(30px);max-height:0;padding:0;margin:0;}}
.panel-item-img-wrap{width:64px;height:64px;border-radius:var(--radius);overflow:hidden;background:#f8f9fa;flex-shrink:0;}
.panel-item-img-wrap img{width:100%;height:100%;object-fit:cover;}
.panel-item-info{flex:1;min-width:0;}
.pib{font-size:9.5px;font-weight:700;color:var(--sub);text-transform:uppercase;}
.pit{font-size:12.5px;font-weight:600;margin:2px 0;line-height:1.3;}
.panel-item-price{font-size:13px;font-weight:800;}
.panel-item-actions{display:flex;align-items:center;justify-content:space-between;margin-top:6px;}
.panel-item-actions .qty-stepper{width:auto;display:inline-flex;}
.panel-item-remove{font-size:11px;color:var(--sub);font-weight:600;}
.panel-item-remove:hover{color:#ff5252;}
.panel-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;text-align:center;color:var(--sub);gap:8px;}
.panel-empty b{color:var(--ink);font-size:14px;}
.panel-empty span{font-size:12px;}
.panel-foot{padding:14px 16px;border-top:1px solid var(--line);}
.panel-summary-row{display:flex;justify-content:space-between;font-size:13px;color:var(--sub);margin-bottom:6px;}
.panel-summary-row.total{color:var(--ink);font-weight:800;font-size:15px;margin:10px 0;}
.btn{width:100%;padding:12px 0;border-radius:var(--radius);font-weight:700;font-size:13.5px;margin-bottom:8px;transition:transform .18s;}
.btn:active{transform:scale(.97);}
.btn-green{background:var(--green);color:#fff;}
.btn-green:hover{background:var(--green-dark);}
.btn-outline{border:1px solid var(--line);color:var(--ink);}

/* toast */
.toast{
  position:fixed;bottom:78px;left:50%;transform:translateX(-50%) translateY(20px);z-index:500;
  background:var(--ink);color:#fff;font-size:12.5px;font-weight:600;padding:10px 18px;border-radius:var(--radius);
  opacity:0;transition:all .35s cubic-bezier(.34,1.56,.64,1);pointer-events:none;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

footer{background:var(--ink);color:#c9ccd1;padding:28px 16px;margin-top:20px;font-size:12px;}
footer .flogo{color:#fff;font-weight:800;font-size:16px;margin-bottom:8px;}

/* smooth catalog switch */
#catalog{transition:opacity .22s ease,transform .22s ease;}
#catalog.fade{opacity:0;transform:translateY(6px);}

.mobile-nav{padding-bottom:calc(8px + env(safe-area-inset-bottom));}
header{padding-top:env(safe-area-inset-top);}

/* ===== Location / serviceability ===== */
.unavailable-box{
  margin:16px 12px;padding:26px 18px;text-align:center;background:var(--card);
  border:1px solid var(--line);border-radius:var(--radius);
}
.unavailable-box .icon-circle{
  width:56px;height:56px;border-radius:50%;background:#fdeeee;color:#e35b5b;
  display:flex;align-items:center;justify-content:center;margin:0 auto 14px;
}
.unavailable-box h3{font-size:15px;font-weight:800;margin-bottom:6px;}
.unavailable-box p{font-size:12.5px;color:var(--sub);line-height:1.5;margin-bottom:14px;}
.unavailable-box button{
  padding:10px 20px;border-radius:var(--radius);background:var(--green);color:#fff;
  font-size:12.5px;font-weight:700;transition:transform .18s;
}
.unavailable-box button:active{transform:scale(.95);}
</style>
</head>
<body>

<header>
  <div class="header-top">
    <div class="logo">
      <div class="logo-mark">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M6 8V6.5a4.5 4.5 0 0 1 9 0V8" stroke="#0f6b4a" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M4.5 8h13l-1 12.2a1.8 1.8 0 0 1-1.8 1.6H7.3a1.8 1.8 0 0 1-1.8-1.6L4.5 8Z" fill="#0f6b4a"/>
          <circle cx="10.6" cy="12" r="1" fill="#d4af37"/>
          <circle cx="13.4" cy="12" r="1" fill="#d4af37"/>
        </svg>
      </div>
      <b>Shop<span>Kart</span></b>
    </div>
    <div class="search-bar" id="searchBar">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input id="searchInput" type="text" placeholder="Search for products, brands and more">
    </div>
    <button class="header-icon" id="wishOpenBtn"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z"/></svg><span class="badge" id="wishBadge" hidden>0</span></button>
    <button class="header-icon" id="cartOpenBtn"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg><span class="badge" id="cartBadge" hidden>0</span></button>
  </div>
  <div class="loc-strip" id="locStrip">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
    <span id="locText">Detecting your location…</span>
    <span class="loc-status pending" id="locStatus"><span class="loc-dot"></span>Checking</span>
  </div>
  <div class="catnav" id="catNav"></div>
</header>

<div id="pageTop">
<div class="hero-wrap">
  <div class="hero-card">
    <img id="heroImg" src="https://images.unsplash.com/photo-1607083206968-13611e3d76db?w=1200&q=75&auto=format&fit=crop" alt="Big sale">
    <div class="hero-dots" id="heroDots"></div>
  </div>
</div>

<div id="catalog"></div>

<div class="toast" id="toast"></div>

<nav class="mobile-nav">
  <a href="#top" class="active"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9.5 12 2l9 7.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></svg>Home</a>
  <a href="#catalog"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Categories</a>
  <a href="#" id="mobileWishBtn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z"/></svg>Wishlist<span class="badge" id="mobWishBadge" hidden>0</span></a>
  <a href="#" id="mobileCartBtn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>Cart<span class="badge" id="mobCartBadge" hidden>0</span></a>
</nav>

<div class="overlay" id="cartOverlay">
  <div class="panel">
    <div class="panel-head"><h3>My Cart</h3><button class="panel-close" id="cartCloseBtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
    <div class="panel-body" id="cartBody"></div>
    <div class="panel-foot" id="cartFoot"></div>
  </div>
</div>

<div class="overlay" id="wishOverlay">
  <div class="panel">
    <div class="panel-head"><h3>Wishlist</h3><button class="panel-close" id="wishCloseBtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
    <div class="panel-body" id="wishBody"></div>
  </div>
</div>

<footer>
  <div class="flogo">ShopKart</div>
  <p>Fashion · Electronics · Grocery · Home &amp; more — all in one place. Demo storefront built for preview purposes.</p>
</footer>
</div><!-- /pageTop -->

<script>

/* ===== Card builder ===== */
function ratingStars(r){
  return `<span class="stars">${r} <svg width="9" height="9" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 21 12 17.77 5.82 21 7 14.14l-5-4.87 6.91-1.01L12 2z"/></svg></span>`;
}
function productCardHTML(p, i){
  const off = Math.round((1 - p.price/p.mrp)*100);
  const qty = CART[p.id] || 0;
  const wished = WISHLIST.has(p.id);
  return `
  <div class="card" id="card-${p.id}" style="animation-delay:${(i%10)*0.04}s">
    <div class="card-img-wrap">
      <img src="${p.img}" alt="${p.title}" loading="lazy">
      <span class="discount-tag">${off}% OFF</span>
      <button class="wish-btn ${wished?'active':''}" data-act="wish" data-id="${p.id}">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="${wished?'currentColor':'none'}" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z"/></svg>
      </button>
    </div>
    <div class="card-body">
      <div class="card-brand">${p.brand}</div>
      <div class="card-title">${p.title}</div>
      <div class="card-rating">${ratingStars(p.rating)}</div>
      <div class="card-price-row">
        <span class="price-now">${inr(p.price)}</span>
        <span class="price-old">${inr(p.mrp)}</span>
      </div>
    </div>
    <div class="card-cta" id="cta-${p.id}">
      ${qty>0 ? qtyStepperHTML(p.id, qty) : `<button class="add-btn" data-act="add" data-id="${p.id}">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg> Add
      </button>`}
    </div>
  </div>`;
}
function qtyStepperHTML(id, qty){
  return `<div class="qty-stepper">
    <button data-act="dec" data-id="${id}">−</button>
    <span data-role="qty">${qty}</span>
    <button data-act="inc" data-id="${id}">+</button>
  </div>`;
}

/* ===== Catalog render (grouped by category bands) ===== */
function renderCatalog(filterCat){
  const el = document.getElementById('catalog');
  const cats = filterCat && filterCat!=='all' ? [filterCat] : [...new Set(PRODUCTS.map(p=>p.cat))];
  el.innerHTML = cats.map(catId=>{
    const cat = CATEGORIES.find(c=>c.id===catId);
    const items = PRODUCTS.filter(p=>p.cat===catId);
    if(!items.length) return '';
    return `
    <div class="section">
      <div class="section-head"><h2>${cat.name}</h2><a href="#">See all <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m9 18 6-6-6-6"/></svg></a></div>
      <div class="grid">${items.map((p,i)=>productCardHTML(p,i)).join('')}</div>
    </div>`;
  }).join('');
}
renderCatalog('all');

/* ===== Geolocation & serviceability (premium touch) ===== */
const INDIA_BOUNDS = {latMin:6, latMax:37.5, lngMin:68, lngMax:97.5};
function isServiceable(lat,lng){
  return lat>=INDIA_BOUNDS.latMin && lat<=INDIA_BOUNDS.latMax && lng>=INDIA_BOUNDS.lngMin && lng<=INDIA_BOUNDS.lngMax;
}
function setLocStatus(kind, text, statusText){
  document.getElementById('locText').textContent = text;
  const s = document.getElementById('locStatus');
  s.className = 'loc-status '+kind;
  s.innerHTML = `<span class="loc-dot"></span>${statusText}`;
}
function showUnavailable(){
  const el = document.getElementById('catalog');
  el.innerHTML = `<div class="unavailable-box">
    <div class="icon-circle"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0Z"/><path d="M9.5 8.5l5 5m0-5-5 5"/></svg></div>
    <h3>Not deliverable to your location</h3>
    <p>We're not available in your area just yet — we're expanding fast! Check back soon or try a different location.</p>
    <button id="retryLocBtn">Try Again</button>
  </div>`;
  document.getElementById('retryLocBtn').addEventListener('click', initLocation);
}
async function reverseGeocode(lat,lng){
  try{
    const res = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lng}&localityLanguage=en`);
    const data = await res.json();
    return data.city || data.locality || data.principalSubdivision || 'your area';
  }catch(e){ return 'your area'; }
}
function initLocation(){
  setLocStatus('pending','Detecting your location…','Checking');
  if(!('geolocation' in navigator)){
    setLocStatus('no','Location unavailable on this device','Unsupported');
    return;
  }
  navigator.geolocation.getCurrentPosition(async pos=>{
    const {latitude:lat, longitude:lng} = pos.coords;
    const ok = isServiceable(lat,lng);
    const place = await reverseGeocode(lat,lng);
    if(ok){
      setLocStatus('ok', `Delivering to ${place}`, 'Available');
      renderCatalog('all');
    } else {
      setLocStatus('no', `${place} — outside delivery zone`, 'Unavailable');
      showUnavailable();
    }
  }, err=>{
    setLocStatus('no','Enable location to check delivery','Permission needed');
  }, {enableHighAccuracy:false, timeout:8000});
}
initLocation();
document.getElementById('locStrip').addEventListener('click', ()=>{
  if(document.getElementById('locStatus').classList.contains('no')) initLocation();
});

/* ===== Category nav interactions (smooth fade swap, header/footer stay fixed) ===== */
function switchCategory(cat){
  const el = document.getElementById('catalog');
  el.classList.add('fade');
  window.scrollTo({top:0, behavior:'smooth'});
  setTimeout(()=>{
    renderCatalog(cat);
    el.classList.remove('fade');
  }, 180);
  document.querySelectorAll('.catnav button').forEach(b=>b.classList.toggle('active', b.dataset.cat===cat));
}
document.getElementById('catNav').addEventListener('click', e=>{
  const btn = e.target.closest('button'); if(!btn) return;
  switchCategory(btn.dataset.cat);
});

/* ===== Toast ===== */
let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 1600);
}

/* ===== Cart / Wishlist logic ===== */
function cartTotal(){ return Object.entries(CART).reduce((s,[id,q])=>s+findProduct(+id).price*q,0); }
function cartCount(){ return Object.values(CART).reduce((a,b)=>a+b,0); }

function setQty(id, qty){
  qty = Math.max(0, qty);
  const isNew = !CART[id] && qty>0;
  if(qty<=0) delete CART[id]; else CART[id]=qty;
  updateBadges();
  const cta = document.getElementById(`cta-${id}`);
  if(cta) cta.innerHTML = qty>0 ? qtyStepperHTML(id, qty) : `<button class="add-btn" data-act="add" data-id="${id}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg> Add</button>`;
  if(qty===0){ cartRemoveRow(id); } else { cartUpsert(id, isNew); }
}
function addToCart(id){
  setQty(id, (CART[id]||0)+1);
  showToast('Added to cart');
  const badge = document.getElementById('cartBadge');
  badge.classList.remove('pop'); void badge.offsetWidth; badge.classList.add('pop');
}
function toggleWish(id){
  const btn = document.querySelector(`.wish-btn[data-id="${id}"]`);
  if(WISHLIST.has(id)){
    WISHLIST.delete(id);
    if(btn){ btn.classList.remove('active'); btn.querySelector('svg').setAttribute('fill','none'); }
    wishRemoveRow(id);
  } else {
    WISHLIST.add(id);
    if(btn){ btn.classList.add('active'); btn.querySelector('svg').setAttribute('fill','currentColor'); }
    wishAddRow(id);
    showToast('Added to wishlist');
  }
  updateBadges();
}
function updateBadges(){
  const cc = cartCount(), wc = WISHLIST.size;
  [['cartBadge',cc],['mobCartBadge',cc],['wishBadge',wc],['mobWishBadge',wc]].forEach(([id,val])=>{
    const el = document.getElementById(id);
    el.hidden = val===0; el.textContent = val;
  });
}

document.body.addEventListener('click', e=>{
  const btn = e.target.closest('[data-act]');
  if(!btn) return;
  const act = btn.dataset.act, id = +btn.dataset.id;
  if(act==='add') addToCart(id);
  else if(act==='inc') setQty(id, (CART[id]||0)+1);
  else if(act==='dec') setQty(id, (CART[id]||0)-1);
  else if(act==='wish') toggleWish(id);
});

/* ===== Panels ===== */
const cartOverlay = document.getElementById('cartOverlay');
const wishOverlay = document.getElementById('wishOverlay');
function openPanel(p){ p.classList.add('open'); document.body.classList.add('lock'); }
function closePanel(p){ p.classList.remove('open'); document.body.classList.remove('lock'); }
function closeAll(){ closePanel(cartOverlay); closePanel(wishOverlay); }

document.getElementById('cartOpenBtn').addEventListener('click', ()=>{ closePanel(wishOverlay); openPanel(cartOverlay); });
document.getElementById('cartCloseBtn').addEventListener('click', ()=>closePanel(cartOverlay));
document.getElementById('mobileCartBtn').addEventListener('click', e=>{ e.preventDefault(); closePanel(wishOverlay); openPanel(cartOverlay); });
cartOverlay.addEventListener('click', e=>{ if(e.target===cartOverlay) closePanel(cartOverlay); });

document.getElementById('wishOpenBtn').addEventListener('click', ()=>{ closePanel(cartOverlay); openPanel(wishOverlay); });
document.getElementById('wishCloseBtn').addEventListener('click', ()=>closePanel(wishOverlay));
document.getElementById('mobileWishBtn').addEventListener('click', e=>{ e.preventDefault(); closePanel(cartOverlay); openPanel(wishOverlay); });
wishOverlay.addEventListener('click', e=>{ if(e.target===wishOverlay) closePanel(wishOverlay); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeAll(); });

/* ===== Cart panel incremental render ===== */
function cartItemRowHTML(p, qty){
  return `
    <div class="panel-item-img-wrap"><img src="${p.img}" alt="${p.title}"></div>
    <div class="panel-item-info">
      <div class="pib">${p.brand}</div>
      <div class="pit">${p.title}</div>
      <div class="panel-item-price" data-role="line-price">${inr(p.price*qty)}</div>
      <div class="panel-item-actions">
        <div class="qty-stepper">
          <button data-act="dec" data-id="${p.id}">−</button>
          <span data-role="qty">${qty}</span>
          <button data-act="inc" data-id="${p.id}">+</button>
        </div>
        <button class="panel-item-remove" data-act="rm" data-id="${p.id}">Remove</button>
      </div>
    </div>`;
}
function cartEmptyState(){
  return `<div class="panel-empty">
    <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>
    <b>Your cart is empty</b><span>Add products to get started.</span>
  </div>`;
}
function initCartPanel(){
  const body = document.getElementById('cartBody');
  const foot = document.getElementById('cartFoot');
  const ids = Object.keys(CART);
  if(!ids.length){ body.innerHTML = cartEmptyState(); foot.innerHTML=''; return; }
  body.innerHTML = ids.map((id,i)=>`<div class="panel-item" id="cart-row-${id}" data-id="${id}" style="animation-delay:${i*0.05}s">${cartItemRowHTML(findProduct(+id), CART[id])}</div>`).join('');
  foot.innerHTML = `
    <div class="panel-summary-row"><span>Subtotal</span><span data-role="subtotal">${inr(cartTotal())}</span></div>
    <div class="panel-summary-row"><span>Delivery</span><span style="color:var(--green-dark);font-weight:700;">Free</span></div>
    <div class="panel-summary-row total"><span>Total</span><span data-role="total">${inr(cartTotal())}</span></div>
    <button class="btn btn-green">Proceed to Checkout</button>
    <button class="btn btn-outline" data-act="continue">Continue Shopping</button>`;
  foot.querySelector('[data-act="continue"]').addEventListener('click', ()=>closePanel(cartOverlay));
}
function cartUpsert(id, isNew){
  const body = document.getElementById('cartBody');
  if(body.querySelector('.panel-empty') || !document.getElementById('cartFoot').children.length){ initCartPanel(); return; }
  if(isNew && !document.getElementById(`cart-row-${id}`)){
    const p = findProduct(id);
    const row = document.createElement('div');
    row.className='panel-item'; row.id=`cart-row-${id}`; row.dataset.id=id;
    row.innerHTML = cartItemRowHTML(p, CART[id]);
    row.style.animationDelay='0s';
    body.prepend(row);
  } else { cartPatchRow(id); }
  cartPatchTotals();
}
function cartPatchRow(id){
  const row = document.getElementById(`cart-row-${id}`); if(!row) return;
  const p = findProduct(id), qty = CART[id];
  const qtyEl = row.querySelector('[data-role="qty"]');
  qtyEl.textContent = qty; qtyEl.classList.remove('bump'); void qtyEl.offsetWidth; qtyEl.classList.add('bump');
  row.querySelector('[data-role="line-price"]').textContent = inr(p.price*qty);
}
function cartRemoveRow(id){
  const row = document.getElementById(`cart-row-${id}`); if(!row){ cartPatchTotals(); return; }
  row.classList.add('removing');
  row.addEventListener('animationend', ()=>{
    row.remove();
    const body = document.getElementById('cartBody');
    if(!body.children.length){ body.innerHTML = cartEmptyState(); document.getElementById('cartFoot').innerHTML=''; }
    else cartPatchTotals();
  }, {once:true});
}
function cartPatchTotals(){
  const foot = document.getElementById('cartFoot');
  if(!foot || !foot.querySelector('[data-role="subtotal"]')) return;
  const total = cartTotal();
  foot.querySelector('[data-role="subtotal"]').textContent = inr(total);
  foot.querySelector('[data-role="total"]').textContent = inr(total);
}

/* ===== Wishlist panel incremental render ===== */
function wishRowHTML(p){
  return `
    <div class="panel-item-img-wrap"><img src="${p.img}" alt="${p.title}"></div>
    <div class="panel-item-info">
      <div class="pib">${p.brand}</div>
      <div class="pit">${p.title}</div>
      <div class="panel-item-price">${inr(p.price)}</div>
      <div class="panel-item-actions">
        <button class="btn btn-green" style="width:auto;padding:8px 14px;font-size:10.5px;margin:0;" data-act="addcart" data-id="${p.id}">Add to Cart</button>
        <button class="panel-item-remove" data-act="rmwish" data-id="${p.id}">Remove</button>
      </div>
    </div>`;
}
function wishEmptyState(){
  return `<div class="panel-empty">
    <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z"/></svg>
    <b>Your wishlist is empty</b><span>Tap the heart on any product to save it here.</span>
  </div>`;
}
function initWishPanel(){
  const body = document.getElementById('wishBody');
  const ids = [...WISHLIST];
  if(!ids.length){ body.innerHTML = wishEmptyState(); return; }
  body.innerHTML = ids.map((id,i)=>`<div class="panel-item" id="wish-row-${id}" data-id="${id}" style="animation-delay:${i*0.05}s">${wishRowHTML(findProduct(id))}</div>`).join('');
}
function wishAddRow(id){
  const body = document.getElementById('wishBody');
  if(body.querySelector('.panel-empty') || !body.children.length){ initWishPanel(); return; }
  if(document.getElementById(`wish-row-${id}`)) return;
  const row = document.createElement('div');
  row.className='panel-item'; row.id=`wish-row-${id}`; row.dataset.id=id;
  row.innerHTML = wishRowHTML(findProduct(id));
  row.style.animationDelay='0s';
  body.prepend(row);
}
function wishRemoveRow(id){
  const row = document.getElementById(`wish-row-${id}`); if(!row) return;
  row.classList.add('removing');
  row.addEventListener('animationend', ()=>{
    row.remove();
    const body = document.getElementById('wishBody');
    if(!body.children.length) body.innerHTML = wishEmptyState();
  }, {once:true});
}

document.getElementById('cartBody').addEventListener('click', e=>{
  const btn = e.target.closest('[data-act]'); if(!btn) return;
  const id = +btn.dataset.id, act = btn.dataset.act;
  if(act==='inc') setQty(id,(CART[id]||0)+1);
  else if(act==='dec') setQty(id,(CART[id]||0)-1);
  else if(act==='rm') setQty(id,0);
});
document.getElementById('wishBody').addEventListener('click', e=>{
  const btn = e.target.closest('[data-act]'); if(!btn) return;
  const id = +btn.dataset.id, act = btn.dataset.act;
  if(act==='addcart') addToCart(id);
  else if(act==='rmwish') toggleWish(id);
});

/* ===== Search filter (simple) ===== */
document.getElementById('searchInput').addEventListener('input', e=>{
  const q = e.target.value.trim().toLowerCase();
  const el = document.getElementById('catalog');
  el.classList.add('fade');
  setTimeout(()=>{
    if(!q){ renderCatalog('all'); el.classList.remove('fade'); return; }
    const items = PRODUCTS.filter(p=> p.title.toLowerCase().includes(q) || p.brand.toLowerCase().includes(q) || p.cat.includes(q));
    el.innerHTML = `<div class="section"><div class="section-head"><h2>Results for "${e.target.value}"</h2></div>
      <div class="grid">${items.map((p,i)=>productCardHTML(p,i)).join('') || '<p style="color:var(--sub);padding:20px 0;">No products found.</p>'}</div></div>`;
    el.classList.remove('fade');
  }, 150);
});

initCartPanel();
initWishPanel();
updateBadges();
</script>
</body>
</html>
